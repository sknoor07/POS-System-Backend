      responses:
        '200':
          description: Shift successfully started

  /api/shift-reports/end:
    patch:
      tags:
        - Shift Report Management
      summary: End Shift
      description: Closes the current active cashier shift, calculating cash drawer total, total sales, and discrepancies.
      responses:
        '200':
          description: Shift successfully ended

  /api/shift-reports/{shiftReportId}:
    get:
      tags:
        - Shift Report Management
      summary: Get Shift Report by ID
