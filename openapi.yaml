# ---------------------------------------------------------------------------
# Reusable Schemas & Components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token obtained from `/auth/login` or `/auth/signup`

  schemas:
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [ROLE_ADMIN, ROLE_STORE_ADMIN, ROLE_STORE_MANAGER, ROLE_BRANCH_MANAGER, ROLE_BRANCH_CASHIER]
        storeId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64

    AuthResponse:
      type: object
      properties:
        jwt:
          type: string
        message:
          type: string
        role:
          type: string

    StoreDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        brand:
          type: string
        description:
          type: string
        storeAdminId:
          type: integer
          format: int64
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]

    BranchDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        storeId:
          type: integer
          format: int64

    CategoryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        storeId:
          type: integer
          format: int64

    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        barcode:
          type: string
        image:
          type: string
        categoryId:
          type: integer
          format: int64
        storeId:
          type: integer
          format: int64

    InventoryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        quantity:
          type: integer
        lowStockAlert:
          type: integer

    CustomerCreateDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    CustomerUpdateDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        loyaltyPoints:
          type: integer

    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        cashierId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        totalAmount:
          type: number
        taxAmount:
          type: number
        discountAmount:
          type: number
        paymentType:
          type: string
          enum: [CASH, CARD, UPI, STRIPE, RAZORPAY]
        orderStatus:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED, REFUNDED]

    RefundDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        cashierId:
          type: integer
          format: int64
        amount:
          type: number
        reason:
          type: string

    ShiftReportDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cashierId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        startingCash:
          type: number
        closingCash:
          type: number
        totalSales:
          type: number
        status:
          type: string
